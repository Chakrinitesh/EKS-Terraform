name: checkov-scan

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install --no-cache-dir checkov

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          output_format: json
          output_file_path: result.json
          
      - name: Upload Scan Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results.json
