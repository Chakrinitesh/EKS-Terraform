name: checkov-scan

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          output_format: cli,sarif
          output_file_path: /home/ubuntu/actions-runner/_work/EKS-Terraform/EKS-Terraform/results.sarif         
    
      - name: Upload Scan Results JSON
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          name: checkov-report
          path: results.sarif
