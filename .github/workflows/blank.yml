name: checkov-scan

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Remove a single specific file
      - name: Remove a file
        run: sudo rm -f /home/ubuntu/actions-runner/_work/EKS-Terraform/EKS-Terraform/results.sarif 

      # Remove a folder and its contents recursively
      - name: Remove a directory
        run: sudo  rm -rf /home/ubuntu/actions-runner/_work/EKS-Terraform/EKS-Terraform/results.sarif 
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install --no-cache-dir checkov

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          output_format: sarif
          output_file_path: /home/ubuntu/actions-runner/_work/EKS-Terraform/EKS-Terraform/results.sarif   
          
    
      - name: Upload Scan Results JSON
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          name: checkov-report
          path: results.sarif
