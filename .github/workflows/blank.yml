name: checkov-scan

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          mkdir: -p output 
          output_format: json
          output_file_path: result.json output/

      - name: Upload Scan Results JSON
        if: always() # Ensures the report is uploaded even if Checkov finds security vulnerabilities
        uses: actions/upload-artifact@v6
        with:
          name: checkov-report
          path: output/result.json
