name: checkov-scan

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          output_format: json
          output_file_path: /home/ubuntu/actions-runner/_work/EKS-Terraform/EKS-Terraform/result.json
          
      - name: Upload Scan Results JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkov-report
          path: result.json
