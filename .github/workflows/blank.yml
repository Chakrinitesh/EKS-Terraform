name: Terraform Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Checkov Terraform Scan
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: json
          output_file_path: result.json 
          log_level: WARNING
          container_user: 1000
          soft_fail: true

      - name: Upload Scan Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-reports/results.json


